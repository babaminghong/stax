<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 100% !important; max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .rule-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .text-input { flex: 1; height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title" style="font-size: 24px;">Stax Rules & Workspaces ⚙️</div>
      <div class="subtitle">Configure automated domain mapping and cloud sync</div>
    </div>
  </div>

  <div class="card">
    <div class="title" style="font-size: 16px; margin-bottom: 12px;">Custom Domain Categorization Engine</div>
    <div id="rulesList">
      <div class="rule-row">
        <input type="text" class="text-input" value="jira.com, github.com" placeholder="Domains or Regex" />
        <input type="text" class="text-input" value="Development" placeholder="Group Name" />
        <select class="select-input" style="width: 120px;">
          <option value="blue" selected>Blue</option>
          <option value="purple">Purple</option>
          <option value="green">Green</option>
        </select>
      </div>
    </div>
    <button id="addRule" class="btn btn-secondary" style="margin-top: 10px;">+ Add Custom Rule</button>
  </div>

  <button id="saveOptions" class="btn btn-primary btn-block" style="margin-top: 20px;">Save Settings</button>
  <script src="options.js"></script>
</body>
</html>
