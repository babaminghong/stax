<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 100% !important; min-height: 100vh; }
    .sidepanel-container { padding: 20px; }
  </style>
</head>
<body>
  <div class="sidepanel-container">
    <div class="header">
      <div>
        <div class="title">Stax Sidebar ⚡</div>
        <div class="subtitle">Live Tab Group Navigator</div>
      </div>
      <span class="badge">SidePanel</span>
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <!-- Live Controls -->
    <div class="card space-y">
      <div class="grid-2">
        <button id="spQuickSort" class="btn btn-primary">⚡ Organize Window</button>
        <button id="spUngroupAll" class="btn btn-secondary">Ungroup All</button>
      </div>
    </div>

    <!-- Group Tree View Container -->
    <div class="card" id="groupTreeContainer">
      <div class="label">Active Groups</div>
      <div id="treeView" class="groups-container" style="margin-top: 8px;">
        Loading active tab groups...
      </div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
