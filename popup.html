<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Onboarding Screen (Shown only once per browser instance) -->
  <div id="onboardingScreen" class="card" style="display: none;">
    <div class="title" id="onboardTitle">Welcome to Stax ⚡</div>
    <p class="subtitle" id="onboardSub">Quick setup (saved permanently to this browser):</p>
    
    <label class="label" id="lblLang">Language / Sprache</label>
    <select id="initLang" class="select-input">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>

    <label class="label" id="lblRole">I am a / Ich bin</label>
    <select id="initRole" class="select-input">
      <option value="Developer">Developer / Entwickler</option>
      <option value="Student">Student / Schüler</option>
      <option value="PowerUser">Power User</option>
      <option value="Other">Other / Sonstiges</option>
    </select>

    <label class="label" id="lblSource">How did you find Stax?</label>
    <select id="initSource" class="select-input">
      <option value="HackClub">Hack Club</option>
      <option value="GitHub">GitHub</option>
      <option value="Friend">Friend / Freund</option>
      <option value="Store">Web Store</option>
    </select>

    <button id="saveOnboarding" class="btn btn-primary" style="margin-top: 12px;">Start Using Stax</button>
  </div>

  <!-- Main Extension View -->
  <div id="mainScreen" style="display: none;">
    <div class="header">
      <div>
        <div class="title">Stax</div>
        <div class="subtitle" id="subTitleText">Smart Tab Engine</div>
      </div>
      <span class="badge">V3 Pro</span>
    </div>

    <div class="card">
      <button id="quickSort" class="btn btn-primary">⚡ Quick Sort (Local)</button>
      <button id="dedupe" class="btn btn-secondary">🧹 Close Duplicates</button>
    </div>

    <div class="card">
      <button id="openTestTabs" class="btn btn-secondary">🚀 Open Test Tab Set</button>
    </div>

    <div class="status">
      <a href="options.html" target="_blank" id="settingsLink" style="color: #9ca3af; text-decoration: none; font-size: 11px;">⚙️ API Key & Settings</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
